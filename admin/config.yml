backend:
  name: github
  repo: sagartravelagency/sagartourandtravelswebsite
  branch: main
media_folder: "assets" # Media files will be stored in the repo under assets/
public_folder: "/assets" # The src attribute for uploaded media will begin with /assets

collections:
  - name: "pages"
    label: "Pages"
    folder: "/"
    extension: "html"
    format: "raw" # Because we are editing raw HTML files without frontmatter
    create: true # Allow creating new pages
    fields:
      - {label: "Body", name: "body", widget: "code"} # Using a code widget for raw HTML editing
